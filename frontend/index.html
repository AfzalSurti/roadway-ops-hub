<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the saved theme before paint so there's no flash of the wrong theme
      // (next-themes' own default storage key/values — kept in sync with App.tsx's ThemeProvider).
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "dark";
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/roadway-logo.svg" />
    <title>RoadwayOps Hub</title>
    <meta
      name="description"
      content="RoadwayOps Hub is a task and report management platform for highway operations with role-based workflows, project tracking, and structured field reporting."
    />
    <meta name="author" content="RoadwayOps" />

    <meta property="og:title" content="RoadwayOps Hub" />
    <meta
      property="og:description"
      content="Manage highway projects, assign tasks, and collect structured field reports in one platform."
    />
    <meta property="og:site_name" content="RoadwayOps Hub" />
    <meta property="og:url" content="https://roadway-ops-hub.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://roadway-ops-hub.vercel.app/landing-hero.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoadwayOps Hub" />
    <meta
      name="twitter:description"
      content="Task and report management platform for highway operations teams."
    />
    <meta name="twitter:image" content="https://roadway-ops-hub.vercel.app/landing-hero.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
