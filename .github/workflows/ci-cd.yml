name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (typecheck + frontend + backend)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Database migrations are deliberately NOT run here — run
          # `npx prisma migrate deploy` by hand on the VPS whenever a
          # schema change ships, same as before.
          script: |
            set -e
            cd /var/www/sankalp
            git pull origin main
            npm install
            npx prisma generate
            npm run build
            pm2 restart sankalp-backend
